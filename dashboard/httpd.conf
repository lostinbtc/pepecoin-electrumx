ServerRoot /var/www
ServerName localhost
Listen 80
PidFile /run/apache2/httpd.pid
ServerTokens Prod
ServerSignature Off
TraceEnable Off

LoadModule mpm_prefork_module /usr/lib/apache2/mod_mpm_prefork.so
LoadModule authz_core_module /usr/lib/apache2/mod_authz_core.so
LoadModule dir_module /usr/lib/apache2/mod_dir.so
LoadModule mime_module /usr/lib/apache2/mod_mime.so
LoadModule log_config_module /usr/lib/apache2/mod_log_config.so
LoadModule unixd_module /usr/lib/apache2/mod_unixd.so
LoadModule reqtimeout_module /usr/lib/apache2/mod_reqtimeout.so
LoadModule php_module /usr/lib/apache2/mod_php84.so

# Preserve the former Debian www-data UID/GID for existing dashboard data volumes.
User dashboard
Group dashboard
ErrorLog /proc/self/fd/2
LogFormat "%h %l %u %t %m %U %>s %b" dashboard
# Do not log query strings: the legacy application puts action tokens in URLs.
CustomLog /proc/self/fd/1 dashboard
TypesConfig /etc/apache2/mime.types
DirectoryIndex index.php
DocumentRoot /var/www/html

<Directory />
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/html>
    Options -Indexes -ExecCGI
    AllowOverride None
    Require all granted
</Directory>
<Directory /var/www/html/src>
    Require all denied
</Directory>
<Directory /var/www/html/data>
    Require all denied
</Directory>
<Directory /var/www/html/views>
    Require all denied
</Directory>
<FilesMatch "^\.">
    Require all denied
</FilesMatch>
<FilesMatch "\.php$">
    SetHandler application/x-httpd-php
</FilesMatch>

StartServers 2
MinSpareServers 2
MaxSpareServers 5
MaxRequestWorkers 20
MaxConnectionsPerChild 1000
Timeout 30
RequestReadTimeout header=20-40,MinRate=500 body=20,MinRate=500
